version: '3.8'

services:
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=queen_of_all_saints_secret_key_2026
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - LOG_LEVEL=INFO
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
    networks:
      - parish_network

  redis:
    container_name: evolution_redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - parish_network

volumes:
  evolution_instances:
  redis_data:

networks:
  parish_network:
    driver: bridge
