        - generic [ref=f9e467]:
          - generic [ref=f9e469]:
            - generic [ref=f9e470]: Sacred Heritage
            - heading "Parish History & Milestones" [level=2] [ref=f9e474]
            - paragraph [ref=f9e475]: From a humble home in K.K. Nagar to a thriving independent parish
          - generic [ref=f9e478]:
            - generic [ref=f9e479]:
              - generic [ref=f9e480]: 1970s
              - generic [ref=f9e484]:
                - generic [ref=f9e485]:
                  - img "The Need for a Church" [ref=f9e486]
                  - generic [ref=f9e488]:
                    - generic [ref=f9e489]: Milestone
                    - heading "The Need for a Church" [level=3] [ref=f9e492]
                - paragraph [ref=f9e494]: When K.K. Nagar was established in the 1970s, it was far from the city centre and the nearest Catholic church. Transport was scarce, and attending Sunday Mass was a great challenge. Mrs. Stella Selvaraj, a schoolteacher, felt deeply the need for a local church and became the driving force behind its founding.
            - generic [ref=f9e495]:
              - generic [ref=f9e496]: "1977"
              - generic [ref=f9e500]:
                - generic [ref=f9e501]:
                  - img "First Mass in a Home" [ref=f9e502]
                  - generic [ref=f9e504]:
                    - generic [ref=f9e505]: Milestone
                    - heading "First Mass in a Home" [level=3] [ref=f9e508]
                - paragraph [ref=f9e510]: In 1977, Fr. Prakash O.Praem arrived in Trichy at the Bishop's request to establish the first Norbertine mission. Catholic families led by Mrs. Stella approached him and requested Sunday Mass. From October 1977 to July 1979, Mass was celebrated every Sunday in Mrs. Stella's own home. The congregation grew week by week.
            - generic [ref=f9e511]:
              - generic [ref=f9e512]: "1979"
              - generic [ref=f9e516]:
                - generic [ref=f9e517]:
                  - img "A Church is Built" [ref=f9e518]
                  - generic [ref=f9e520]:
                    - generic [ref=f9e521]: Milestone
                    - heading "A Church is Built" [level=3] [ref=f9e524]
                - paragraph [ref=f9e526]: Thanks to Mrs. Stella's tireless efforts, land was purchased and a tiled-roof building was constructed with Fr. John Van Adrichen O.Praem's assistance. Sunday Masses and the All Saints Academy nursery school began here. K.K. Nagar became part of the Sempattu parish mission.
            - generic [ref=f9e527]:
              - generic [ref=f9e528]: "1994"
              - generic [ref=f9e532]:
                - generic [ref=f9e533]:
                  - img "Named Queen of All Saints" [ref=f9e534]
                  - generic [ref=f9e536]:
                    - generic [ref=f9e537]: Milestone
                    - heading "Named Queen of All Saints" [level=3] [ref=f9e540]
                - paragraph [ref=f9e542]: From 1994, through the efforts of Fr. John Francis O.Praem, the church was officially named Queen of All Saints Church. The grand chariot festival began annually. Separate Tamil and English Masses were introduced, uniting the whole community.
            - generic [ref=f9e543]:
              - generic [ref=f9e544]: 19 Sep 1999
              - generic [ref=f9e548]:
                - generic [ref=f9e549]:
                  - img "Consecrated as an Independent Parish" [ref=f9e550]
                  - generic [ref=f9e552]:
                    - generic [ref=f9e553]: Milestone
                    - heading "Consecrated as an Independent Parish" [level=3] [ref=f9e556]
                - paragraph [ref=f9e558]: On 19 September 1999, the new church was consecrated by Bishop Peter Fernando and established as an independent parish. Fr. Benedict Paul Raj O.Praem became the first Parish Priest.
            - generic [ref=f9e559]:
              - generic [ref=f9e560]: Today
              - generic [ref=f9e564]:
                - generic [ref=f9e565]:
                  - img "Our Parish Family" [ref=f9e566]
                  - generic [ref=f9e568]:
                    - generic [ref=f9e569]: Milestone
                    - heading "Our Parish Family" [level=3] [ref=f9e572]
                - paragraph [ref=f9e574]: Today, Queen of All Saints is home to vibrant Catholic families across K.K. Nagar, Tiruchirappalli. With our Eucharistic Chapel, bell tower, and 10 active ministries, our parish family gathers weekly to worship God and care for one another.
