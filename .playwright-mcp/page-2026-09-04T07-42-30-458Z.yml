            - img "Rev. Fr. ArokiyaSwamy O.Praem — Parish Priest" [ref=f9e429]
            - generic [ref=f9e433]:
              - generic [ref=f9e434]:
                - heading "Rev. Fr. ArokiyaSwamy O.Praem" [level=2] [ref=f9e435]
                - paragraph [ref=f9e436]: Parish Priest · since 2025
              - blockquote [ref=f9e442]: “Welcome to Queen of All Saints Parish. May this be a home where you encounter Christ, grow in faith, and experience the love of our Church family.”
              - paragraph [ref=f9e444]: Fr. ArokiyaSwamy O.Praem has served as Parish Priest of Queen of All Saints Church since 2025. He guides the parish in the Norbertine spirit of regular prayer, pastoral visits, and practical care for all families across the 13 Anbiyams.
