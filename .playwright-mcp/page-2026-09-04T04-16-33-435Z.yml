        - generic [ref=f11e49]:
          - img "Portrait of Jeffin Josva S, developer" [ref=f11e52]:
            - img "Jeffin Josva S" [ref=f11e53]
          - generic [ref=f11e57]:
            - paragraph [ref=f11e72]: Platform Developer
            - generic [ref=f11e73]:
              - heading "Jeffin Josva S" [level=1] [ref=f11e74]
              - paragraph [ref=f11e75]: Founder & Lead Developer
            - generic [ref=f11e76]:
              - paragraph [ref=f11e77]: Queen of All Saints Digital Parish Platform
              - paragraph [ref=f11e78]: Diocese of Tiruchirappalli · Built with faith and purpose
            - paragraph [ref=f11e81]: “I built this platform not as a product, but as an act of service to my parish family and to the God who has been faithful to me.”
        - generic [ref=f11e83]:
          - generic [ref=f11e85]:
            - paragraph [ref=f11e86]: In His Own Words
            - heading "Vision, Motivation & Purpose" [level=2] [ref=f11e87]
          - generic [ref=f11e88]:
            - generic [ref=f11e90]:
              - heading "The Vision" [level=3] [ref=f11e94]
              - paragraph [ref=f11e95]: "When I looked at our parish, I saw families travelling to the office for forms that could be submitted in minutes online. I saw records kept in paper registers that could be lost in a flood. I saw a community rich in faith but underserved by its tools. The vision was simple: build a system worthy of this parish."
            - generic [ref=f11e97]:
              - heading "The Motivation" [level=3] [ref=f11e101]
              - paragraph [ref=f11e102]: I grew up in this parish. I attended catechism here, served as an altar server, and sang in the choir. Every line of code in this platform carries a memory of this community. This is not a project — it is a personal offering to the parish that shaped my faith.
            - generic [ref=f11e104]:
              - heading "The Goal" [level=3] [ref=f11e110]
              - paragraph [ref=f11e111]: The goal was never to impress with technology. The goal was to remove friction from parish life so that families can spend less time on administration and more time in worship, service, and community. Technology should be invisible — and faith should be central.
        - generic [ref=f11e113]:
          - generic [ref=f11e115]:
            - paragraph [ref=f11e116]: With Gratitude
            - heading "Acknowledgements" [level=2] [ref=f11e117]
            - paragraph [ref=f11e118]: This platform was not built alone. It was built with, for, and because of this community.
          - generic [ref=f11e119]:
            - generic [ref=f11e121]:
              - heading "The Parish Priest" [level=3] [ref=f11e126]
              - paragraph [ref=f11e127]: பங்குத் தந்தை
              - paragraph [ref=f11e129]: “For trusting a parishioner with the responsibility of building this platform. Your spiritual guidance, patience, and blessing made this possible.”
            - generic [ref=f11e131]:
              - heading "Parish Office & Coordinators" [level=3] [ref=f11e139]
              - paragraph [ref=f11e140]: பங்கு அலுவலகம் & ஒருங்கிணைப்பாளர்கள்
              - paragraph [ref=f11e142]: “For your tireless feedback, testing, and willingness to change workflows you had followed for decades. Your service to this parish is immeasurable.”
            - generic [ref=f11e144]:
              - heading "Our Parish Families" [level=3] [ref=f11e150]
              - paragraph [ref=f11e151]: நம் பங்கு குடும்பங்கள்
              - paragraph [ref=f11e153]: “For your trust, your patience during development, and your encouragement. Every family that registered on this platform gave it purpose and meaning.”
          - paragraph [ref=f11e155]: "\"To God be the glory — for it is He who gave the skill, the time, and the purpose.\""
