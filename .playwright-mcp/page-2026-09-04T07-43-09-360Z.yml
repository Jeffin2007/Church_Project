                - paragraph [ref=f9e494]: 1970-களில் கே.கே. நகர் புதிதாக உருவான போது, அது நகர மையத்திலிருந்து நெடுந்தொலைவில் அமைந்திருந்தது. போக்குவரத்து வசதிகள் இல்லாததால் ஞாயிறு திருப்பலியில் பங்கேற்பது மிகுந்த சிரமமாக இருந்தது. பள்ளி ஆசிரியை திருமதி ஸ்டெல்லா செல்வராஜ் உள்ளூரிலேயே ஓர் ஆலயம் அமைய வேண்டும் என்ற தாகத்துடன் முன்னோடியாகச் செயல்பட்டார்.
