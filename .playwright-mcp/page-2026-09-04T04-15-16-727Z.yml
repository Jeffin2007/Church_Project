      - main "About the Digital Parish Platform" [ref=f10e46]:
        - generic [ref=f10e50]:
          - img "Official Digital Platform — Queen of All Saints Church, Diocese of Tiruchirappalli" [ref=f10e52]:
            - generic [ref=f10e56]:
              - paragraph [ref=f10e57]: Official Digital Platform
              - paragraph [ref=f10e58]: Queen of All Saints Church
              - paragraph [ref=f10e59]: Diocese of Tiruchirappalli
          - paragraph [ref=f10e70]: Digital Parish Platform
          - heading "About This Platform" [level=1] [ref=f10e71]
          - paragraph [ref=f10e72]: Understanding how technology serves our parish family — simply, securely, and faithfully.
          - paragraph [ref=f10e73]: இந்த டிஜிட்டல் தளம் எப்படி நம் பங்கு குடும்பத்திற்கு சேவை செய்கிறது என்பதை புரிந்துகொள்வோம்.
        - generic [ref=f10e75]:
          - generic [ref=f10e77]:
            - paragraph [ref=f10e78]: Why We Built This
            - heading "Why Our Parish Adopted This Platform" [level=2] [ref=f10e79]: Why Our Parish AdoptedThis Platform
            - paragraph [ref=f10e80]: Eight reasons this digital platform was built for our parish family.
          - generic [ref=f10e81]:
            - generic [ref=f10e83]:
              - heading "Simplify Parish Administration" [level=3] [ref=f10e88]
              - paragraph [ref=f10e89]: நிர்வாகத்தை எளிதாக்குகிறது
              - paragraph [ref=f10e90]: Reduce the workload on parish staff by moving paper registers, certificates, and family records to a secure digital system.
            - generic [ref=f10e92]:
              - heading "Better Communication" [level=3] [ref=f10e96]
              - paragraph [ref=f10e97]: சிறந்த தகவல் தொடர்பு
              - paragraph [ref=f10e98]: Reach every parish family instantly with announcements, Mass timings, feast schedules, and important notices.
            - generic [ref=f10e100]:
              - heading "Secure Parish Records" [level=3] [ref=f10e105]
              - paragraph [ref=f10e106]: பாதுகாப்பான பங்கு பதிவுகள்
              - paragraph [ref=f10e107]: Baptism, marriage, and confirmation records are stored safely and can never be lost, damaged, or misplaced.
            - generic [ref=f10e109]:
              - heading "Online Services" [level=3] [ref=f10e114]
              - paragraph [ref=f10e115]: ஆன்லைன் சேவைகள்
              - paragraph [ref=f10e116]: Request sacramental certificates, appointments, and contributions from the comfort of your home — any time, any day.
            - generic [ref=f10e118]:
              - heading "Reduced Paperwork" [level=3] [ref=f10e124]
              - paragraph [ref=f10e125]: காகித பணிகள் குறைகின்றன
              - paragraph [ref=f10e126]: Forms, receipts, and records are handled digitally — saving time for families and parish staff alike.
            - generic [ref=f10e128]:
              - heading "Preserve Parish History" [level=3] [ref=f10e132]
              - paragraph [ref=f10e133]: பங்கு வரலாறு பாதுகாக்கப்படுகிறது
              - paragraph [ref=f10e134]: The history, photographs, and milestones of our parish since 1977 are preserved digitally for future generations.
            - generic [ref=f10e136]:
              - heading "Encourage Ministry Participation" [level=3] [ref=f10e143]
              - paragraph [ref=f10e144]: பணி பங்கேற்பை ஊக்குவிக்கிறது
              - paragraph [ref=f10e145]: Families can discover, join, and stay connected with parish ministries and anbiyams through the platform.
            - generic [ref=f10e147]:
              - heading "Strengthen Parish–Family Connection" [level=3] [ref=f10e152]
              - paragraph [ref=f10e153]: பங்கு–குடும்ப தொடர்பை வலுப்படுத்துகிறது
              - paragraph [ref=f10e154]: The platform keeps families informed, involved, and spiritually connected to their parish community.
        - generic [ref=f10e156]:
          - generic [ref=f10e158]:
            - paragraph [ref=f10e159]: How It Helps You
            - heading "How It Helps Your Family" [level=2] [ref=f10e160]
            - paragraph [ref=f10e161]: Six services designed to make parish life simpler for every family.
          - generic [ref=f10e162]:
            - generic [ref=f10e164]:
              - heading "Family Portal" [level=3] [ref=f10e169]
              - paragraph [ref=f10e170]: குடும்ப போர்டல்
              - paragraph [ref=f10e171]: Register your family, manage member details, view your sacramental history, and stay updated with parish news — all in one secure place.
            - generic [ref=f10e173]:
              - heading "Online Contributions" [level=3] [ref=f10e177]
              - paragraph [ref=f10e178]: ஆன்லைன் காணிக்கை
              - paragraph [ref=f10e179]: Make tithes, feast contributions, and special offerings securely online. Receive instant digital receipts for every transaction.
            - generic [ref=f10e181]:
              - heading "Sacramental Requests" [level=3] [ref=f10e186]
              - paragraph [ref=f10e187]: அருட்சாதன கோரிக்கைகள்
              - paragraph [ref=f10e188]: Request baptism, marriage, confirmation, and other sacramental appointments directly from your phone without visiting the parish office.
            - generic [ref=f10e190]:
              - heading "Parish Announcements" [level=3] [ref=f10e195]
              - paragraph [ref=f10e196]: பங்கு அறிவிப்புகள்
              - paragraph [ref=f10e197]: Never miss an important notice. Feast schedules, novena times, and special events are delivered directly to your family portal.
            - generic [ref=f10e199]:
              - heading "Digital Receipts" [level=3] [ref=f10e204]
              - paragraph [ref=f10e205]: டிஜிட்டல் ரசீதுகள்
              - paragraph [ref=f10e206]: Every contribution and payment generates a permanent digital receipt that can be downloaded or printed whenever needed.
            - generic [ref=f10e208]:
              - heading "Parish Calendar" [level=3] [ref=f10e212]
              - paragraph [ref=f10e213]: பங்கு காலண்டர்
              - paragraph [ref=f10e214]: View the full liturgical calendar, feast days, novena schedules, ministry meetings, and parish events in one organised place.
        - generic [ref=f10e216]:
          - generic [ref=f10e218]:
            - paragraph [ref=f10e223]: Our Promise to You
            - heading "Privacy Commitment" [level=2] [ref=f10e224]
            - paragraph [ref=f10e225]: Your family's information is treated with the same confidentiality as a confessional seal. Here is exactly how we protect it.
          - generic [ref=f10e226]:
            - generic [ref=f10e228]:
              - heading "Personal Information is Protected" [level=3] [ref=f10e233]
              - paragraph [ref=f10e234]: All your family information — names, contact details, and sacramental records — is stored in a private, secured database. It is never shared with outside organisations.
            - generic [ref=f10e236]:
              - heading "Only Authorised Staff Can Access Records" [level=3] [ref=f10e242]
              - paragraph [ref=f10e243]: Only the Parish Priest, Parish Office staff, and authorised coordinators have access to parish records. Every person has a specific role with specific permissions.
            - generic [ref=f10e245]:
              - heading "Role-Based Permissions" [level=3] [ref=f10e250]
              - paragraph [ref=f10e251]: A catechism coordinator can only see catechism records. A finance member can only see financial records. No staff member can access information outside their role.
            - generic [ref=f10e253]:
              - heading "Secure Authentication" [level=3] [ref=f10e257]
              - paragraph [ref=f10e258]: Every staff login is protected with strong passwords and secure tokens. Unauthorised access is blocked automatically.
            - generic [ref=f10e260]:
              - heading "Audit Logging" [level=3] [ref=f10e267]
              - paragraph [ref=f10e268]: Every action in the system — who accessed a record, who changed a field, and when — is recorded permanently. This ensures complete accountability.
            - generic [ref=f10e270]:
              - heading "Secure Payment Processing" [level=3] [ref=f10e274]
              - paragraph [ref=f10e275]: All online contributions are processed through a certified payment gateway. Your payment card details are never stored on parish servers.
            - generic [ref=f10e277]:
              - heading "Parish-Approved Administration" [level=3] [ref=f10e282]
              - paragraph [ref=f10e283]: The entire platform is operated and maintained under the direct oversight of the Parish Priest. Nothing is done without parish authorisation.
          - paragraph [ref=f10e285]: "\"Your personal information is your family's property. This platform exists to serve you — not to collect, sell, or misuse your data.\""
        - generic [ref=f10e287]:
          - generic [ref=f10e289]:
            - paragraph [ref=f10e290]: Simple Process
